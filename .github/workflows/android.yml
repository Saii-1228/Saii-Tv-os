name: Build SAII OS TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms/android-37.0" || {
            echo 'Android SDK Platform 37.0 is not available on this runner.' >&2
            exit 1
          }

      - name: Extract and locate project
        shell: bash
        run: |
          ZIP="$GITHUB_WORKSPACE/SAII-OS-TV-Stage-2.zip"
          test -f "$ZIP" || { echo 'Stage 2 ZIP not found in repository root.' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/saii-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/saii-source"
          PROJECT_DIR="$(find "$RUNNER_TEMP/saii-source" -type f -path '*/app/build.gradle.kts' -print -quit | sed 's#/app/build.gradle.kts$##')"
          test -n "$PROJECT_DIR" || { echo 'Could not find app/build.gradle.kts inside the Stage 2 ZIP.' >&2; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project located at: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saii-os-tv-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
