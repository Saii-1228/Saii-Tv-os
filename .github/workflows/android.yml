
name: Build SAII OS TV APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare project sources
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/app/build.gradle.kts" ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          elif [ -f "$GITHUB_WORKSPACE/SAII-OS-TV-Stage-2.zip" ]; then
            mkdir -p "$GITHUB_WORKSPACE/build-source"
            unzip -q "$GITHUB_WORKSPACE/SAII-OS-TV-Stage-2.zip" -d "$GITHUB_WORKSPACE/build-source"
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/build-source/SAII-OS-TV" >> "$GITHUB_ENV"
          else
            echo "Stage 2 ZIP or project files not found" >&2
            exit 1
          fi

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saii-os-tv-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
